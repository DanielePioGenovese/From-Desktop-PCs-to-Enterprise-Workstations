title: Hardware for Artificial Intelligence
description: "From Desktop PCs to Enterprise Workstations — a free book by Daniele Genovese, in English and Italian."
author: Daniele Genovese
lang: en

url: "https://danielepiogenovese.github.io"
baseurl: "/From-Desktop-PCs-to-Enterprise-Workstations"

# just-the-docs: sidebar with every chapter, plus full-text search.
# Installed as a gem via the Gemfile and built by .github/workflows/pages.yml.
# jekyll-include-cache is required by the theme ({% include_cached %}); without
# it the build dies with "Unknown tag 'include_cached'".
theme: just-the-docs
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

# Jekyll never reads a theme's own _config.yml, so without this every page is
# emitted as a bare HTML fragment: no <head>, no stylesheet, no sidebar.
defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
search:
  heading_level: 2
  previews: 3

heading_anchors: true

# The table of contents at the top of each chapter stops at top-level sections (##).
# Without this it would also pull in every ### subsection and run very long.
kramdown:
  toc_levels: "1..2"

# Header links, shown on wide screens next to the search box. Deliberately just
# GitHub: the PDFs are already offered on the home page and on each edition's
# index, so repeating them up here was clutter.
#
# Note if you ever add one back: aux_links values are emitted verbatim, because
# _config.yml is not run through Liquid. A bare "/pdf/..." would resolve to the
# domain root and 404 — the full repo path has to be spelled out.
aux_links:
  "GitHub":
    - "https://github.com/DanielePioGenovese/From-Desktop-PCs-to-Enterprise-Workstations"
aux_links_new_tab: false

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Hardware for Artificial Intelligence — Daniele Genovese. Released under the <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/">CC BY-NC-ND 4.0</a> license.'

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
